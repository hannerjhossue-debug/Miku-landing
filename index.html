<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatsune Miku - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-pink: #ec4899;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-cyan);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            font-size: 1rem;
        }

        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-label {
            display: flex;
            flex-direction: column;
        }

        .toggle-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .toggle-desc {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-cyan);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }

        .btn-save:hover {
            opacity: 0.9;
        }

        #mensajeFeedback {
            margin-top: 12px;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-active { background-color: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-off { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2><i class="fa-solid fa-sliders"></i> Ajustes del Grupo</h2>

        <div class="form-group">
            <label for="selectGrupo"><i class="fa-solid fa-users"></i> Seleccionar Chat / Grupo:</label>
            <select id="selectGrupo" onchange="actualizarSeleccionUI()">
                <option value="1203630XXXXX@g.us">Pruebas bot (Grupo Principal)</option>
            </select>
        </div>

        <div class="toggle-container">
            <div class="toggle-label">
                <span class="toggle-title">Encender / Apagar Bot</span>
                <span class="toggle-desc">Habilita o deshabilita las respuestas de comandos</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggleBot" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-container">
            <div class="toggle-label">
                <span class="toggle-title">Filtro Anti-Enlaces (AntiLinks)</span>
                <span class="toggle-desc">Borra automáticamente los links enviadas al chat</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggleAntiLinks">
                <span class="slider"></span>
            </label>
        </div>

        <button class="btn-save" onclick="guardarConfiguracion()">
            <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
        </button>

        <div id="mensajeFeedback"></div>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-list-check"></i> Estado del Bot</h2>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <strong id="nombreGrupoActual">Pruebas bot</strong><br>
                <small style="color: var(--text-sub);" id="idGrupoActual">1203630XXXXX@g.us</small>
            </div>
            <span id="badgeEstadoGrupo" class="status-badge badge-active">ACTIVO</span>
        </div>
    </div>
</div>

<script>
    // 📌 CONFIGURACIÓN DE TU BOT
    // Reemplaza esta URL por el puerto/dominio público donde corre tu bot en SkyUltraPlus
    const API_BOT_URL = 'https://panel.skyultraplus.com/server/f5682e0c/console'; 

    function actualizarSeleccionUI() {
        const selectGrupo = document.getElementById('selectGrupo');
        const nombreGrupo = selectGrupo.options[selectGrupo.selectedIndex].text;
        const idGrupo = selectGrupo.value;

        document.getElementById('nombreGrupoActual').innerText = nombreGrupo;
        document.getElementById('idGrupoActual').innerText = idGrupo;
        document.getElementById('mensajeFeedback').innerText = '';
    }

    async function guardarConfiguracion() {
        const selectGrupo = document.getElementById('selectGrupo');
        const groupId = selectGrupo.value;
        const botActivo = document.getElementById('toggleBot').checked;
        const antiLinks = document.getElementById('toggleAntiLinks').checked;
        const feedback = document.getElementById('mensajeFeedback');
        const badge = document.getElementById('badgeEstadoGrupo');

        feedback.style.color = 'var(--accent-cyan)';
        feedback.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';

        try {
            const res = await fetch(`${API_BOT_URL}/api/config-grupo`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    groupId: groupId,
                    botActivo: botActivo,
                    antiLinks: antiLinks
                })
            });

            const data = await res.json();

            if (res.ok && data.status === 'ok') {
                feedback.style.color = '#10b981';
                feedback.innerText = '✅ ¡Sincronizado al instante con el Bot!';

                // Actualizar badge visual
                if (botActivo) {
                    badge.className = 'status-badge badge-active';
                    badge.innerText = 'ACTIVO';
                } else {
                    badge.className = 'status-badge badge-off';
                    badge.innerText = 'APAGADO';
                }
            } else {
                throw new Error(data.message || 'Error del servidor');
            }
        } catch (err) {
            console.error(err);
            feedback.style.color = '#ef4444';
            feedback.innerText = '❌ No se pudo conectar con el bot. Verifica la URL de la API.';
        }
    }
</script>

</body>
    </html>
