<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miku Bot Dashboard 🩵</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background-color: #0b0e14; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    
    .bg-glow {
      position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0, 229, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
      z-index: -1; pointer-events: none;
    }

    .navbar {
      width: 100%; max-width: 900px; padding: 20px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
    }
    .logo { display: flex; align-items: center; gap: 10px; color: #00e5ff; font-weight: 700; }
    .miku-dot { width: 10px; height: 10px; background-color: #00e5ff; border-radius: 50%; box-shadow: 0 0 10px #00e5ff; }

    .container { width: 100%; max-width: 450px; margin-top: 50px; padding: 20px; }
    .card {
      background: rgba(18, 24, 38, 0.85); border: 1px solid rgba(0, 229, 255, 0.2);
      backdrop-filter: blur(10px); border-radius: 16px; padding: 30px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 { font-size: 1.4rem; margin-bottom: 10px; color: #fff; }
    p.subtitle { font-size: 0.85rem; color: #94a3b8; margin-bottom: 25px; }

    .btn-github {
      width: 100%; background-color: #24292e; color: white; border: 1px solid #00e5ff;
      padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: 0.3s;
    }
    .btn-github:hover { background-color: #00e5ff; color: #0b0e14; }

    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-profile img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #00e5ff; }
    .btn-logout { background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }

    .link-box {
      background: rgba(0, 229, 255, 0.05); padding: 15px; border-radius: 8px;
      border: 1px dashed #00e5ff; margin: 20px 0; text-align: left;
    }
    .code-container { background: #05070a; padding: 10px; border-radius: 6px; margin-top: 8px; text-align: center; }
    code { color: #00e5ff; font-weight: bold; font-family: monospace; font-size: 1.1rem; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <header class="navbar">
    <div class="logo">
      <span class="miku-dot"></span>
      <span>Miku Dashboard</span>
    </div>
    <div id="user-profile" class="user-profile hidden">
      <img id="user-avatar" src="" alt="Avatar">
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>
  </header>

  <main class="container">
    
    <!-- LOGIN BOX -->
    <section id="login-box" class="card">
      <h2>Panel de Control 🩵</h2>
      <p class="subtitle">Inicia sesión con tu cuenta de GitHub para continuar.</p>
      
      <button class="btn-github" onclick="loginWithGitHub()">
        <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        Entrar con GitHub
      </button>
    </section>

    <!-- DASHBOARD BOX -->
    <section id="dashboard-content" class="card hidden">
      <h2>¡Hola, <span id="user-name" style="color:#00e5ff;">Usuario</span>! 👋</h2>
      <p class="subtitle">Gestiona tu vinculación con la bot de WhatsApp.</p>
      
      <div class="link-box">
        <p style="font-size:0.8rem; color:#94a3b8;">1. Copia tu código único de vinculación:</p>
        <div class="code-container">
          <code id="link-code">!vincular LINK-0000</code>
        </div>
        <p style="font-size:0.75rem; color:#94a3b8; margin-top:8px;">2. Envía este comando al chat de la bot para asociar tu WhatsApp.</p>
      </div>
    </section>

  </main>

  <script>
    // Tu Client ID de GitHub OAuth App
    const GITHUB_CLIENT_ID = "Ov23liMjklGcMnD5lCBV";

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const githubCode = urlParams.get('code');

      // Si GitHub nos regresó un código tras autenticar
      if (githubCode) {
        const githubUser = {
          name: "Usuario GitHub",
          picture: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
        };
        saveSession(githubUser);
        window.history.replaceState({}, document.title, window.location.pathname);
        return;
      }

      // Si ya existía una sesión guardada
      const storedUser = JSON.parse(localStorage.getItem("session_user"));
      if (storedUser) {
        showDashboard(storedUser);
      }
    });

    function loginWithGitHub() {
      const redirectUri = window.location.href.split('?')[0];
      window.location.href = `https://github.com/login/oauth/authorize?client_id=${GITHUB_CLIENT_ID}&redirect_uri=${redirectUri}`;
    }

    function saveSession(userData) {
      localStorage.setItem("session_user", JSON.stringify(userData));
      showDashboard(userData);
    }

    function showDashboard(user) {
      document.getElementById("login-box").classList.add("hidden");
      document.getElementById("dashboard-content").classList.remove("hidden");
      document.getElementById("user-profile").classList.remove("hidden");

      document.getElementById("user-name").textContent = user.name;
      document.getElementById("user-avatar").src = user.picture;

      // Genera un código dinámico para el usuario
      const userHash = Math.floor(1000 + Math.random() * 9000);
      document.getElementById("link-code").textContent = `!vincular LINK-${userHash}`;
    }

    function logout() {
      localStorage.removeItem("session_user");
      window.location.reload();
    }
  </script>
</body>
</html>
