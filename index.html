<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hatsune Miku - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-cyan: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-cyan);
        }

        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-title {
            font-weight: 600;
            font-size: 0.95rem;
            display: block;
        }

        .toggle-desc {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-cyan);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        .btn-save:hover {
            opacity: 0.9;
        }

        #mensajeFeedback {
            margin-top: 14px;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-active { background-color: rgba(16, 185, 129, 0.2); color: #10b981; }
        .badge-off { background-color: rgba(239, 68, 68, 0.2); color: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2><i class="fa-solid fa-sliders"></i> Control General del Bot</h2>

        <div class="toggle-container">
            <div>
                <span class="toggle-title">Encender / Apagar Bot</span>
                <span class="toggle-desc">Habilita o deshabilita los comandos</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggleBot" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-container">
            <div>
                <span class="toggle-title">Filtro Anti-Enlaces (AntiLinks)</span>
                <span class="toggle-desc">Borra automáticamente los links en el chat</span>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggleAntiLinks">
                <span class="slider"></span>
            </label>
        </div>

        <button class="btn-save" onclick="guardarConfiguracion()">
            <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
        </button>

        <div id="mensajeFeedback"></div>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-list-check"></i> Estado Actual</h2>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <strong>Hatsune Miku Bot</strong><br>
                <small style="color: var(--text-sub);">Sincronización Web</small>
            </div>
            <span id="badgeEstadoGrupo" class="status-badge badge-active">ACTIVO</span>
        </div>
    </div>
</div>

<script>
    const BIN_URL = 'https://api.jsonbin.io/v3/b/6a6bb0d1f5f4af5e29d75982';
    
    // Al abrir la página, te pedirá tu Master Key una sola vez y la guardará segura en tu teléfono
    let MASTER_KEY = localStorage.getItem('miku_jsonbin_key');

    if (!MASTER_KEY) {
        MASTER_KEY = prompt('Ingresa tu X-Master-Key de JSONBin (se guardará en tu navegador):');
        if (MASTER_KEY) {
            localStorage.setItem('miku_jsonbin_key', MASTER_KEY.trim());
        }
    }

    // Cargar estado inicial desde JSONBin al abrir la web
    async function cargarEstadoInicial() {
        if (!MASTER_KEY) return;
        try {
            const res = await fetch(`${BIN_URL}/latest`, {
                headers: { 'X-Master-Key': MASTER_KEY }
            });
            if (res.ok) {
                const data = await res.json();
                const config = data.record;
                
                document.getElementById('toggleBot').checked = config.botActivo !== false;
                document.getElementById('toggleAntiLinks').checked = config.antiLinks === true;
                actualizarBadge(config.botActivo !== false);
            }
        } catch (e) {
            console.error('Error al cargar datos iniciales:', e);
        }
    }

    function actualizarBadge(activo) {
        const badge = document.getElementById('badgeEstadoGrupo');
        if (activo) {
            badge.className = 'status-badge badge-active';
            badge.innerText = 'ACTIVO';
        } else {
            badge.className = 'status-badge badge-off';
            badge.innerText = 'APAGADO';
        }
    }

    async function guardarConfiguracion() {
        if (!MASTER_KEY) {
            alert('Necesitas ingresar tu Master Key para guardar.');
            return;
        }

        const botActivo = document.getElementById('toggleBot').checked;
        const antiLinks = document.getElementById('toggleAntiLinks').checked;
        const feedback = document.getElementById('mensajeFeedback');

        feedback.style.color = 'var(--accent-cyan)';
        feedback.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando cambios...';

        try {
            const res = await fetch(BIN_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify({
                    botActivo: botActivo,
                    antiLinks: antiLinks
                })
            });

            if (res.ok) {
                feedback.style.color = '#10b981';
                feedback.innerText = '✅ ¡Cambios guardados con éxito!';
                actualizarBadge(botActivo);
            } else {
                throw new Error('Error en la API');
            }
        } catch (err) {
            console.error(err);
            feedback.style.color = '#ef4444';
            feedback.innerText = '❌ Error al guardar. Revisa tu Master Key.';
        }
    }

    // Ejecutar carga inicial
    cargarEstadoInicial();
</script>

</body>
            </html>
