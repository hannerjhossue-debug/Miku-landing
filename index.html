<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Bot</title>
  <link rel="stylesheet" href="style.css">
  <!-- SDK de Google para Login -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <header>
    <h1>Bot Dashboard 🩵</h1>
    <div id="user-profile" class="hidden">
      <img id="user-avatar" src="" alt="Avatar">
      <span id="user-name"></span>
      <button onclick="logout()">Cerrar Sesión</button>
    </div>
  </header>

  <main>
    <!-- Modal / Caja de Login -->
    <section id="login-box" class="card">
      <h2>Iniciar Sesión</h2>
      <p>Selecciona una opción para acceder a tu panel de control:</p>
      
      <!-- Botón de Google -->
      <div id="g_id_onload"
        data-client_id="TU_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
        data-callback="handleGoogleLogin">
      </div>
      <div class="g_id_signin" data-type="standard"></div>

      <br>

      <!-- Botón de GitHub -->
      <button class="btn-github" onclick="loginWithGitHub()">
        <svg height="20" width="20" viewBox="0 0 16 16" fill="white">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        Iniciar sesión con GitHub
      </button>
    </section>

    <!-- Contenido del Dashboard (Oculto hasta iniciar sesión) -->
    <section id="dashboard-content" class="card hidden">
      <h2>¡Bienvenido al Panel de Control!</h2>
      <p>Aún no has vinculado tu cuenta con WhatsApp.</p>
      
      <!-- Paso de Vinculación Segura con WhatsApp -->
      <div class="link-whatsapp-box">
        <h3>Vincular con tu WhatsApp</h3>
        <p>Envía el siguiente comando al chat de la bot para asociar tu perfil:</p>
        <code id="link-code">!vincular LINK-XXXX</code>
      </div>
    </section>
  </main>

  <script src="auth.js"></script>
</body>
</html>
